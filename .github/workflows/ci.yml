name: CI — tests, package extension, build docker

on:
  push:
    branches: [ main ]
    tags: ['v*', 'release-*']
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test-server:
    name: Build and test Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check (no DATABASE_URL needed – no query! macros)
        run: |
          cd server
          cargo check --all-targets
      - name: Clippy
        run: |
          cd server
          cargo clippy --all-targets -- -D warnings

  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create extension zip
        run: |
          cd extension
          zip -r ../codocs-extension-${{ github.sha }}.zip .
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: codocs-extension-${{ github.sha }}.zip

  build-docker:
    name: Build Docker image and save artifact
    runs-on: ubuntu-latest
    needs: [test-server, package-extension]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to ghcr
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and tag image
        run: |
          docker build -f server/Dockerfile -t ghcr.io/${{ github.repository_owner }}/codocs:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/codocs:latest server/
      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/codocs:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/codocs:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save image as artifact
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/codocs:${{ github.sha }} | gzip > codocs-image-${{ github.sha }}.tar.gz
      - name: Upload docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: codocs-image-${{ github.sha }}.tar.gz
